<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mdAnything - Markdown Editor</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Han+Sans+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="welcome-screen" id="welcomeScreen" aria-hidden="true">
    <canvas class="welcome-rain" id="welcomeRain" aria-hidden="true"></canvas>
    <div class="welcome-center">
      <img class="welcome-logo" src="favicon.ico" alt="mdAnything logo" />
      <div class="welcome-title">mdAnything</div>
      <div class="welcome-tagline" id="welcomeTagline">Markdown Helper Editor</div>
      <div class="welcome-gradient-line" aria-hidden="true"></div>
      <div class="welcome-actions" role="group" aria-label="language selection">
        <button type="button" class="welcome-lang-btn" id="langEnBtn">English</button>
        <button type="button" class="welcome-lang-btn" id="langZhBtn">漢語</button>
      </div>
    </div>
    <div class="welcome-bottom">
      <div class="welcome-links">
        <a class="welcome-icon-link" href="https://github.com/Nerolithos" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 1.25A10.75 10.75 0 0 0 1.25 12a10.75 10.75 0 0 0 7.35 10.2c.54.1.73-.22.73-.5v-1.9c-2.99.65-3.62-1.27-3.62-1.27-.49-1.22-1.19-1.54-1.19-1.54-.98-.66.08-.65.08-.65 1.08.08 1.66 1.1 1.66 1.1.96 1.64 2.53 1.17 3.14.9.1-.69.38-1.17.68-1.44-2.39-.27-4.9-1.18-4.9-5.28 0-1.16.42-2.1 1.1-2.84-.11-.27-.48-1.35.1-2.82 0 0 .9-.29 2.95 1.08a10.52 10.52 0 0 1 5.38 0c2.05-1.37 2.94-1.08 2.94-1.08.59 1.47.22 2.55.11 2.82.69.74 1.1 1.68 1.1 2.84 0 4.11-2.52 5-4.92 5.27.39.33.73.98.73 1.98v2.94c0 .28.2.61.74.5A10.75 10.75 0 0 0 22.75 12 10.75 10.75 0 0 0 12 1.25Z" />
          </svg>
        </a>
        <a class="welcome-icon-link" href="https://blog.nero-lithos.com/" target="_blank" rel="noopener noreferrer" aria-label="Blog">
          <img src="blog.png" alt="Blog" />
        </a>
        <a class="welcome-icon-link tomato-link" href="https://lguide.net/" target="_blank" rel="noopener noreferrer" aria-label="Tomato link">🍅</a>
      </div>
      <div class="welcome-contact">Andyson Chu&nbsp;&nbsp;&nbsp;&nbsp;Nerolithos@hotmail.com</div>
    </div>
  </section>

  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="favicon.ico" alt="mdAnything icon" />
      <span>mdAnything</span>
    </div>
    <div class="topbar-right">
      <label class="switch-wrap" for="renderToggle" data-onboarding-target="render-switch">
        <input type="checkbox" id="renderToggle" />
        <span>开启渲染</span>
      </label>
      <label class="switch-wrap" for="latexHintToggle">
        <input type="checkbox" id="latexHintToggle" />
        <span>兼容提示</span>
      </label>
      <label class="switch-wrap" for="lineGuideToggle">
        <input type="checkbox" id="lineGuideToggle" />
        <span>行辅助线</span>
      </label>
      <button class="download-btn" id="downloadBtn" type="button">下载</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="toolbar-panel" data-onboarding-target="toolbar-panel">
      <h2>工具</h2>

      <section class="tool-group">
        <h3>格式</h3>
        <div class="heading-picker">
          <button class="tool-btn heading-main" type="button">标题</button>
          <div class="heading-menu">
            <button class="tool-btn" type="button" data-action="heading-1"># 一级标题</button>
            <button class="tool-btn" type="button" data-action="heading-2">## 二级标题</button>
            <button class="tool-btn" type="button" data-action="heading-3">### 三级标题</button>
            <button class="tool-btn" type="button" data-action="heading-4">#### 四级标题</button>
          </div>
        </div>
        <button class="tool-btn" data-action="bold" data-shortcut="Ctrl/Cmd + B">粗体</button>
        <button class="tool-btn" data-action="italic" data-shortcut="Ctrl/Cmd + I">斜体</button>
        <button class="tool-btn" data-action="underline" data-shortcut="Ctrl/Cmd + Shift + U">下划线</button>
        <button class="tool-btn" data-action="strike" data-shortcut="Ctrl/Cmd + Shift + X">删除线</button>
        <button class="tool-btn" data-action="sup" data-shortcut="Ctrl/Cmd + U">上角标</button>
        <button class="tool-btn" data-action="sub" data-shortcut="Ctrl/Cmd + J">下角标</button>
      </section>

      <section class="tool-group">
        <h3>代码与数学</h3>
        <button class="tool-btn" data-action="inline-code" data-shortcut="Ctrl/Cmd + K">行内代码</button>
        <button class="tool-btn" data-action="code-block" data-shortcut="Ctrl/Cmd + Shift + K">代码块</button>
        <button class="tool-btn" data-action="insert-inline-math">插入 $...$</button>
        <button class="tool-btn" data-action="insert-block-math">插入 $$...$$</button>
      </section>

      <section class="tool-group">
        <h3>链接</h3>
        <div class="heading-picker">
          <button class="tool-btn heading-main" type="button">链接</button>
          <div class="heading-menu">
            <button class="tool-btn" type="button" data-action="insert-web-link">网页链接</button>
            <button class="tool-btn" type="button" data-action="insert-image-link">图片链接</button>
            <button class="tool-btn" type="button" data-action="insert-file-link">文件链接</button>
            <button class="tool-btn" type="button" data-action="insert-image-link-from-clipboard" data-shortcut="Ctrl/Cmd + Shift + G">剪贴板图片链接</button>
          </div>
        </div>
      </section>

      <section class="tool-group">
        <h3>表格</h3>
        <button class="tool-btn" id="openTableBuilder">建表</button>
        <button class="tool-btn" id="convertToTable">文本转 MD 表格</button>
      </section>

      <section class="tool-group">
        <h3>LaTeX</h3>
        <button class="tool-btn" id="openLatexCompat">兼容检查</button>
      </section>
    </aside>

    <section class="editor-panel">
      <div class="editor-wrap">
        <div class="line-numbers" id="lineNumbers"></div>
        <div class="guide-layer" id="guideLayer" aria-hidden="true"></div>
        <div class="render-layer" id="renderLayer" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" placeholder="开始输入 Markdown...\n\n输入 $$ 会自动进入数学模式，下一次 $$ 结束。\n输入 $ 进入单行数学模式，下一次 $ 结束。\n输入 ``` 会触发语言选择。"></textarea>
      </div>
    </section>
  </main>

  <section class="math-keyboard" id="mathKeyboard" aria-hidden="true">
    <div class="math-head">
      <div class="math-title">数学符号键盘</div>
      <button type="button" class="download-btn custom-math-btn" id="customMathBtn" title="新增一个自定义数学按钮">自定义</button>
    </div>
    <div class="math-grid" id="mathGrid"></div>
  </section>

  <dialog id="tableDialog">
    <form method="dialog" class="dialog-form" id="tableForm">
      <h3>创建表格</h3>
      <label>行数 <input type="number" min="1" value="3" id="tableRows" required /></label>
      <label>列数 <input type="number" min="1" value="3" id="tableCols" required /></label>
      <div class="dialog-actions">
        <button type="button" id="tableCancel">取消</button>
        <button type="submit">插入</button>
      </div>
    </form>
  </dialog>

  <dialog id="languageDialog">
    <form method="dialog" class="dialog-form" id="languageForm">
      <h3>选择代码语言</h3>
      <label>
        语言
        <select id="languageSelect">
          <option value="plaintext">plaintext</option>
          <option value="javascript">javascript</option>
          <option value="typescript">typescript</option>
          <option value="python">python</option>
          <option value="bash">shell(bash)</option>
          <option value="php">php</option>
          <option value="yaml">yaml</option>
          <option value="toml">toml</option>
          <option value="cpp">cpp</option>
          <option value="java">java</option>
          <option value="go">go</option>
          <option value="rust">rust</option>
          <option value="json">json</option>
          <option value="html">html</option>
          <option value="css">css</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" id="languageCancel">取消</button>
        <button type="submit">确定</button>
      </div>
    </form>
  </dialog>

  <dialog id="mathTemplateDialog">
    <form method="dialog" class="dialog-form" id="mathTemplateForm">
      <h3 id="mathTemplateTitle">数学模板</h3>
      <div id="mathTemplateFields"></div>
      <div class="dialog-actions">
        <button type="button" id="mathTemplateCancel">取消</button>
        <button type="submit">插入</button>
      </div>
    </form>
  </dialog>

  <dialog id="downloadDialog">
    <form method="dialog" class="dialog-form" id="downloadForm">
      <h3>选择下载格式</h3>
      <div class="dialog-actions">
        <button type="button" id="downloadMdBtn">下载 .md</button>
        <button type="button" id="downloadTxtBtn">下载 .txt</button>
        <button type="button" id="downloadPdfBtn">下载 .pdf</button>
      </div>
      <div class="dialog-actions">
        <button type="button" id="downloadCancel">取消</button>
      </div>
    </form>
  </dialog>

  <dialog id="customMathDialog">
    <form method="dialog" class="dialog-form" id="customMathForm">
      <h3>自定义数学按钮</h3>
      <label>
        按钮标题
        <input id="customMathLabelInput" value="Ω" maxlength="8" required />
      </label>
      <label>
        预览表达式 (KaTeX)
        <input id="customMathDisplayInput" value="\Omega" required />
      </label>
      <div class="math-preview-box" id="customMathPreview"></div>
      <div class="math-preview-status" id="customMathStatus"></div>
      <div class="dialog-actions">
        <button type="button" id="customMathCancel">取消</button>
        <button type="submit" id="customMathSave">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="latexCompatDialog">
    <form method="dialog" class="dialog-form" id="latexCompatForm">
      <h3 id="latexCompatTitle">LaTeX 兼容检查</h3>
      <div class="latex-compat-summary" id="latexCompatSummary"></div>
      <ul class="latex-compat-list" id="latexCompatList"></ul>
      <div class="dialog-actions">
        <button type="button" id="latexCompatClose">关闭</button>
      </div>
    </form>
  </dialog>

  <div class="latex-compat-tooltip" id="latexCompatTooltip" aria-hidden="true">
    <div class="latex-compat-tooltip-content" id="latexCompatTooltipContent"></div>
    <div class="latex-compat-tooltip-arrow" aria-hidden="true"></div>
  </div>

  <div class="onboarding-overlay" id="onboardingOverlay" aria-hidden="true"></div>
  <section class="onboarding-card" id="onboardingCard" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
    <div class="onboarding-step" id="onboardingStep">步骤 1 / 3</div>
    <h3 id="onboardingTitle">欢迎使用 mdAnything</h3>
    <p id="onboardingDesc">这里会用三步带你快速上手。</p>
    <div class="onboarding-actions">
      <button type="button" class="onboarding-btn" id="onboardingNextBtn">下一步</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
